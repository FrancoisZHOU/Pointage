<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7A2E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pointage">
<title>Pointage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237A2E2E'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23C9A961' stroke-width='5'/><path d='M50 32 L50 50 L62 58' stroke='%23C9A961' stroke-width='5' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --cream: #FBF7F0; --ink: #1F1B17; --wine: #7A2E2E; --gold: #C9A961;
    --moss: #4A5D3A; --stone: #8B8478; --paper: #F1EADD; --line: rgba(31,27,23,0.08);
    --shadow: 0 1px 2px rgba(0,0,0,0.03), 0 6px 20px rgba(0,0,0,0.05);
  }
  html, body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream); color: var(--ink);
    min-height: 100vh; overflow-x: hidden;
  }
  body { background-image: radial-gradient(circle at 15% 10%, rgba(201,169,97,0.05), transparent 40%), radial-gradient(circle at 85% 90%, rgba(122,46,46,0.04), transparent 40%); }
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
  .hidden { display: none !important; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; font-size: 16px; }

  /* ============ EMPLOYEE VIEW ============ */
  #employee-view { min-height: 100vh; display: flex; flex-direction: column; }
  .emp-header {
    padding: 22px 26px 18px; display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--line);
  }
  .emp-header .brand { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; letter-spacing: -0.3px; }
  .emp-header .brand small { display: block; font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--stone); font-weight: 600; margin-top: 2px; }
  .emp-header .now { text-align: right; }
  .emp-header .now .time { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; color: var(--wine); line-height: 1; }
  .emp-header .now .day { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--stone); margin-top: 5px; }

  .cards { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; align-content: start; }
  @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }

  .ecard {
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 24px 22px 22px;
    box-shadow: var(--shadow); position: relative; overflow: hidden; display: flex; flex-direction: column;
    transition: box-shadow .25s ease;
  }
  .ecard::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--stone); opacity:.25; transition: all .25s; }
  .ecard.service::before { background: var(--moss); opacity:1; }
  .ecard.pause::before { background: var(--gold); opacity:1; }
  .ecard .ename { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; line-height:1; }
  .ecard .estate { margin-top:8px; font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:600; color:var(--stone); }
  .ecard.service .estate { color: var(--moss); }
  .ecard.pause .estate { color: #A8852F; }
  .ecard .etimer { font-family:'Cormorant Garamond',serif; font-size:46px; font-weight:600; margin:14px 0 4px; line-height:1; letter-spacing:-1px; }
  .ecard .esub { font-size:12px; color:var(--stone); min-height:16px; letter-spacing:.3px; }
  .ecard .ebtns { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .ecard .ebtns.row { flex-direction:row; }
  .ebtn {
    flex:1; padding:17px 14px; border-radius:4px; font-size:13px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; transition: transform .08s ease, background .15s ease, opacity .15s; text-align:center;
  }
  .ebtn:active { transform: scale(0.97); }
  .ebtn.start { background:var(--ink); color:var(--cream); }
  .ebtn.start:hover { background:var(--moss); }
  .ebtn.end { background:var(--wine); color:#fff; }
  .ebtn.pause { background:var(--paper); color:var(--ink); border:1px solid var(--line); }
  .ebtn.resume { background:var(--gold); color:#fff; }
  .ecard .toast {
    position:absolute; inset:0; background:rgba(255,255,255,.96); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .ecard .toast.show { opacity:1; pointer-events:auto; }
  .ecard .toast .check { width:54px; height:54px; border-radius:50%; background:var(--moss); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .ecard .toast.endt .check { background:var(--wine); }
  .ecard .toast .ttime { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; }
  .ecard .toast .tlabel { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--stone); }
  .ecard .toast .tsegs { font-size:12px; color:var(--stone); text-align:center; margin-top:4px; line-height:1.5; padding:0 10px; }

  .admin-link {
    text-align:center; padding:18px; font-size:10px; letter-spacing:3px; text-transform:uppercase;
    color:var(--stone); opacity:.5; border-top:1px solid var(--line);
  }

  /* ============ MODAL / ADMIN ============ */
  .overlay { position:fixed; inset:0; background:rgba(31,27,23,.45); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; }
  .modal { background:var(--cream); border-radius:8px; width:100%; max-width:440px; max-height:92vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .modal.wide { max-width:920px; }
  .modal-head { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--cream); z-index:6; }
  .modal-head h2 { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; }
  .modal-body { padding:22px 24px; }
  .x { font-size:26px; color:var(--stone); line-height:1; padding:4px 8px; }

  /* PIN pad */
  .pin-display { display:flex; gap:12px; justify-content:center; margin:8px 0 22px; }
  .pin-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--stone); transition:all .15s; }
  .pin-dot.filled { background:var(--wine); border-color:var(--wine); }
  .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pin-key { padding:18px; font-size:22px; font-family:'Cormorant Garamond',serif; font-weight:600; background:#fff; border:1px solid var(--line); border-radius:6px; transition:transform .08s; }
  .pin-key:active { transform:scale(.95); background:var(--paper); }
  .pin-err { color:var(--wine); text-align:center; font-size:13px; min-height:18px; margin-top:12px; }
  .link-btn { background:none; color:var(--stone); text-decoration:underline; font-size:12px; display:block; margin:14px auto 0; }

  /* Admin tabs */
  .tabs { display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--cream); position:sticky; top:65px; z-index:6; overflow-x:auto; }
  .tab { padding:14px 16px; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--stone); border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active { color:var(--wine); border-bottom-color:var(--wine); }

  .lang-switch { display:flex; gap:0; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .lang-switch button { padding:5px 10px; font-size:11px; font-weight:600; color:var(--stone); background:#fff; }
  .lang-switch button.active { background:var(--wine); color:#fff; }

  /* Records */
  .day-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .day-nav button { padding:8px 14px; background:#fff; border:1px solid var(--line); border-radius:5px; font-size:18px; }
  .day-nav .dlabel { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
  .rec { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:12px; }
  .rec h3 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
  .rec h3 .ot { font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; color:var(--wine); letter-spacing:.5px; }
  .rec h3 .ot.zero { color:var(--stone); }
  .rec .seg { font-size:13px; color:var(--ink); margin-top:8px; line-height:1.6; }
  .rec .seg .lbl { display:inline-block; min-width:64px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--stone); }
  .rec .pausetag { color:var(--gold); font-size:11px; }
  .rec .meta { font-size:12px; color:var(--stone); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); display:flex; justify-content:space-between; }
  .rec .editrow { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .mini { padding:7px 12px; font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; border-radius:4px; border:1px solid var(--line); background:#fff; }
  .mini.wine { background:var(--wine); color:#fff; border-color:var(--wine); }
  .mini.ghost { color:var(--stone); }
  .empty { text-align:center; color:var(--stone); padding:30px; font-size:14px; }
  .override-flag { display:inline-block; font-size:10px; background:var(--gold); color:#fff; padding:2px 7px; border-radius:3px; letter-spacing:1px; text-transform:uppercase; margin-left:8px; vertical-align:middle; }

  /* Forms */
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--stone); margin-bottom:6px; font-weight:600; }
  .field input, .field select { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
  .btn-primary { width:100%; padding:15px; background:var(--ink); color:var(--cream); border-radius:5px; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  .btn-primary:active { transform:scale(.99); }
  .btn-sec { width:100%; padding:13px; background:transparent; border:1px solid var(--line); border-radius:5px; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--ink); margin-top:8px; }
  .seg-edit { background:var(--paper); border-radius:6px; padding:12px; margin-bottom:10px; }
  .seg-edit .seg-edit-head { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--stone); font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .sched-day { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
  .sched-day .dn { font-weight:600; font-size:14px; margin-bottom:8px; }
  .sched-times { font-size:13px; color:var(--stone); }
  .emp-pick { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .emp-pick button { padding:9px 16px; border:1px solid var(--line); border-radius:20px; font-size:13px; font-weight:600; background:#fff; color:var(--stone); }
  .emp-pick button.active { background:var(--wine); color:#fff; border-color:var(--wine); }
  .note { font-size:12px; color:var(--stone); line-height:1.6; background:var(--paper); padding:12px 14px; border-radius:6px; margin-bottom:16px; }
  .month-pick { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .month-pick select { flex:1; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; }
  .stat .sl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--stone); }
  .stat .sv { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; margin-top:4px; }
  .stat .sv small { font-size:14px; color:var(--stone); }
  .danger { color:var(--wine); }
  .pause-list-item { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .pause-list-item input { flex:1; }
  .plan-wrap{overflow:auto;max-height:58vh;position:relative;border:1px solid var(--line);border-radius:6px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
  @media (min-width:700px){ .plan-wrap{max-height:none;overflow:visible} }
  .pl-corner{font-size:9px!important;letter-spacing:.3px!important;color:var(--stone);text-transform:none!important;font-weight:600}
  .plan-table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px;min-width:340px}
  .plan-table thead th{position:sticky;top:0;z-index:3;background:var(--cream)}
  .plan-table .pl-day, .plan-table thead th:first-child{position:sticky;left:0;z-index:2;background:var(--cream)}
  .plan-table thead th:first-child{z-index:4}
  tr.today .pl-day{background:#F3ECDC}
  .plan-table th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  .plan-table td{padding:7px 4px;vertical-align:middle;text-align:center}
  .pl-emp-sep{border-left:1px solid var(--line)}
  tr.pl-am td{border-bottom:1px dashed rgba(31,27,23,.10);padding-bottom:4px}
  tr.pl-pm td{border-bottom:1px solid var(--line);padding-top:4px}
  .pl-day{font-weight:700;white-space:nowrap;font-size:11px;text-align:left!important}
  .pl-day span{font-weight:400;color:var(--stone);font-size:10px;margin-left:4px}
  .pl-seg{font-size:9px;letter-spacing:1px;color:var(--stone);opacity:.8;text-align:left!important;white-space:nowrap}
  .pl-cell{cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:10.5px;line-height:1.3}
  .pl-cell.ov{box-shadow:inset 0 -2px 0 var(--gold)}
  .pl-cell.draft{background:rgba(201,169,97,.16);box-shadow:inset 0 -2px 0 var(--gold)}
  .pl-repos{color:var(--stone);opacity:.45}
  .pl-sched{color:var(--stone);font-size:9px}
  .pl-old{color:var(--stone);font-size:9px;text-decoration:line-through;opacity:.75}
  .pl-red{color:var(--wine);font-weight:700}
  .pl-blue{color:#2B5AA7;font-weight:700}
  .pl-green{color:var(--moss);font-weight:700}
  .ct-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;background:rgba(31,27,23,.06);color:var(--ink)}
  .ct-badge.ct-yellow{background:rgba(201,169,97,.25);color:#7A5C1E;font-weight:700}
  .ct-badge.ct-red{background:rgba(122,28,28,.15);color:var(--wine);font-weight:700}
  .ct-badge.ct-dead{background:var(--wine);color:#fff;font-weight:700}
  .seg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
  .seg-t{white-space:nowrap;width:96px;font-variant-numeric:tabular-nums}
  .seg-n{font-weight:700;width:18px;text-align:center}
  .seg-barwrap{flex:1;height:10px;background:rgba(31,27,23,.06);border-radius:5px;overflow:hidden}
  .seg-bar{display:block;height:100%;background:var(--gold);border-radius:5px}
  .seg-row.zero .seg-n{color:var(--wine)}
  .seg-row.zero .seg-barwrap{background:rgba(122,28,28,.14)}
  .seg-emp{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .lane{display:flex;align-items:center;gap:8px;padding:2px 0}
  .lane-name{width:72px;font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-otb{color:var(--wine);font-size:9px;font-weight:700}
  .pl-cell b{font-weight:600}
  .pl-cov{color:var(--stone);font-size:10px;white-space:nowrap;text-align:center}
  .pl-cov b{color:var(--wine);font-weight:700}
  tr.today td{background:rgba(201,169,97,.10)}
  .pl-total td{font-weight:700;border-top:2px solid rgba(31,27,23,.2);font-size:11px;padding-top:9px}
  .pl-total .pl-lbl{font-weight:600;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);text-align:left!important}
  .emp-detail{border-collapse:collapse;width:100%;font-size:11px;margin-bottom:14px}
  .emp-detail th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  .emp-detail td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
  .ed-d{font-weight:700;white-space:nowrap} .ed-d span{font-weight:400;color:var(--stone);font-size:9px}
  .ed-ot{color:var(--wine);font-weight:700}
  .stat.clickable{cursor:pointer;position:relative}
  .stat.clickable::after{content:'›';position:absolute;top:12px;right:14px;color:var(--stone);font-size:16px;opacity:.5}
  .recovery-box { background:var(--ink); color:var(--gold); font-family:'Cormorant Garamond',serif; font-size:28px; letter-spacing:4px; text-align:center; padding:18px; border-radius:6px; margin:12px 0; font-weight:600; }
</style>
</head>
<body>

<!-- ============ EMPLOYEE VIEW ============ -->
<div id="employee-view">
  <div class="emp-header">
    <div class="brand serif">Pointage<small id="brand-sub">Présences</small></div>
    <div class="now">
      <div class="time tnum serif" id="live-clock">--:--</div>
      <div class="day" id="live-date"></div>
    </div>
  </div>
  <div class="cards" id="emp-cards"></div>
  <div class="admin-link" id="open-admin">· Administration ·</div>
</div>

<!-- modal mount -->
<div id="modal-mount"></div>

<script>

function emp(id){ return DATA.employees.find(e=>e.id===id); }

// ---------- TIME HELPERS ----------
function pad(n){ return String(n).padStart(2,'0'); }
function hms(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toSec(t){ if(!t) return 0; const p=t.split(':').map(Number); return p[0]*3600+p[1]*60+(p[2]||0); }
function secToHMS(s){ s=Math.max(0,Math.round(s)); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function secToHM(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h+'h'+pad(m); }
function hm(t){ return t? t.slice(0,5):''; } // HH:MM display
function todayKey(){ return dateKey(new Date()); }

// span handling (no overnight expected, but guard)
function spanSec(startT,endT){ let s=toSec(startT), e=toSec(endT); if(e<s) e+=86400; return e-s; }

// ---------- COMPUTATION ----------
// 选出某天该用哪一版排班（生效日 ≤ 当天 的最近一版；都晚于当天则用最早一版）
function scheduleFor(e, dKey){
  if(!e || !e.scheduleVersions || !e.scheduleVersions.length) return {};
  let best=null;
  e.scheduleVersions.forEach(v=>{
    const f = v.from || '0000-00-00';
    if(f <= dKey){ if(!best || f > (best.from||'0000-00-00')) best=v; }
  });
  if(!best){
    best = e.scheduleVersions.slice().sort((a,b)=>(a.from||'0000-00-00').localeCompare(b.from||'0000-00-00'))[0];
  }
  return best ? best.schedule : {};
}
function templateContract(empId, dKey){
  const e=emp(empId); if(!e) return {am:null,pm:null};
  const dow = new Date(dKey+'T12:00:00').getDay();
  const sc = scheduleFor(e, dKey)[dow];
  return sc?{am:sc.am||null, pm:sc.pm||null}:{am:null,pm:null};
}
function getContract(empId, dKey){
  const rec = DATA.records[dKey] && DATA.records[dKey][empId];
  if(rec && rec.override) return rec.override;
  return templateContract(empId, dKey);
}
function shiftNet(sh){
  let net = spanSec(sh.start, sh.end);
  (sh.pauses||[]).forEach(p=>{ if(p.start&&p.end) net -= spanSec(p.start,p.end); });
  return Math.max(0,net);
}
function shiftPause(sh){
  let pz=0; (sh.pauses||[]).forEach(p=>{ if(p.start&&p.end) pz+=spanSec(p.start,p.end); }); return pz;
}
// split threshold between am/pm
function bucketThreshold(contract){
  if(contract.am && contract.pm) return (toSec(contract.am[1])+toSec(contract.pm[0]))/2;
  return toSec('16:00'); // default split
}
function assignBucket(sh, contract){
  return toSec(sh.start) < bucketThreshold(contract) ? 'am' : 'pm';
}
// per-day overtime {am, pm, total}
// 加班口径: 2026-08-01 起 = 额定窗口之外的实际工作时间全计加班(早到照算,窗口内短缺不抵扣);
// 之前的历史沿用旧口径(净工时超出额定部分),保证已签认账目不漂移。
const OT_POLICY_FROM='2026-08-01';
function dayOvertime(empId, dKey){
  const rec = DATA.records[dKey] && DATA.records[dKey][empId];
  if(!rec || !rec.shifts || !rec.shifts.length) return {am:0,pm:0,total:0};
  const contract = getContract(empId, dKey);
  const buckets={am:[],pm:[]};
  rec.shifts.forEach(sh=>{ buckets[assignBucket(sh,contract)].push(sh); });
  const newPolicy = dKey >= OT_POLICY_FROM;
  function bucketOT(list, seg){
    if(!list.length) return 0;
    const netWorked = list.reduce((a,sh)=>a+shiftNet(sh),0);
    if(!seg) return netWorked; // hors planning → tout compte
    const cStart=toSec(seg[0]), cEnd=toSec(seg[1]), cDur=cEnd-cStart;
    if(newPolicy){
      // 实际工作段落在 [cStart,cEnd] 之外的部分累加
      let ot=0;
      list.forEach(sh=>{ shiftSegments(sh).forEach(sg=>{
        let a=toSec(sg[0]), b=toSec(sg[1]); if(b<a) b+=86400;
        if(b<=a) return;
        if(a<cStart) ot += Math.min(b,cStart)-a;
        if(b>cEnd) ot += b-Math.max(a,cEnd);
      }); });
      return ot;
    }
    const ins = list.map(sh=>toSec(sh.start)), outs = list.map(sh=>{ let e=toSec(sh.end); if(e<toSec(sh.start))e+=86400; return e; });
    const earliestIn = Math.min(...ins), latestOut = Math.max(...outs);
    const presence = latestOut-earliestIn;
    const pauseEq = presence - netWorked;
    const ot = Math.max(latestOut,cEnd) - Math.min(earliestIn,cStart) - pauseEq - cDur;
    return Math.max(0, ot);
  }
  const am=bucketOT(buckets.am, contract.am), pm=bucketOT(buckets.pm, contract.pm);
  return {am, pm, total:am+pm};
}
function dayNetWorked(empId, dKey){
  const rec = DATA.records[dKey] && DATA.records[dKey][empId];
  if(!rec || !rec.shifts) return 0;
  return rec.shifts.reduce((a,sh)=>a+shiftNet(sh),0);
}
// repas: 1 par segment travaillé (matin/soir), max 2/jour — basé sur les pointages réels
function dayMeals(empId, dKey){
  const rec = DATA.records[dKey] && DATA.records[dKey][empId];
  if(!rec || !rec.shifts || !rec.shifts.length) return 0;
  const contract = getContract(empId, dKey);
  const netB={am:0,pm:0};
  rec.shifts.forEach(sh=>{ netB[assignBucket(sh,contract)] += shiftNet(sh); });
  return (netB.am>0?1:0) + (netB.pm>0?1:0);
}
// worked segments of a shift (split by pauses) → [[start,end],...]
function shiftSegments(sh){
  const segs=[]; let cur=sh.start;
  (sh.pauses||[]).forEach(p=>{ if(p.start&&p.end){ segs.push([cur,p.start]); cur=p.end; } });
  segs.push([cur, sh.end]); return segs;
}

// ---------- SOUND (gentle two-tone) ----------
let AC=null;
function ping(end){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const now=AC.currentTime;
    const notes = end? [659.25,523.25] : [523.25,659.25]; // C5,E5
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      const ts=now+i*0.09;
      g.gain.setValueAtTime(0, ts);
      g.gain.linearRampToValueAtTime(0.12, ts+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ts+0.22);
      o.connect(g); g.connect(AC.destination); o.start(ts); o.stop(ts+0.25);
    });
  }catch(e){}
}

function liveState(empId){

function activeElapsed(empId){
  const a=DATA.active[empId]; if(!a) return 0;
  const now=Date.now();
  let span=(now - new Date(a.startTs).getTime())/1000;
  (a.pauses||[]).forEach(p=>{ const e=p.endTs?new Date(p.endTs).getTime():now; span-=(e-new Date(p.startTs).getTime())/1000; });
  return Math.max(0,span);
}
function todayCompletedNet(empId){
  const rec=DATA.records[todayKey()] && DATA.records[todayKey()][empId];
  if(!rec||!rec.shifts) return 0;

}
// contract end for an in-progress shift (to choose Fin de service vs Terminer)
function activeContractEnd(empId){
  const a=DATA.active[empId]; if(!a) return null;
  const startD=new Date(a.startTs);
  const contract=getContract(empId, dateKey(startD));
  const startSec=startD.getHours()*3600+startD.getMinutes()*60+startD.getSeconds();
  const seg = startSec < bucketThreshold(contract) ? contract.am : contract.pm;
  return seg? toSec(seg[1]) : null;
}
function endLabel(empId){
  const ce=activeContractEnd(empId);
  if(ce===null) return 'Terminer';
  const now=new Date(); const nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  return nowSec>=ce ? 'Terminer' : 'Fin de service';
}

const cardLock={};
function punch(empId, act){
  if(cardLock[empId]) return; // 确认提示期间锁定，防误触
  const now=new Date(); const nowISO=now.toISOString(); const tstr=hms(now);
  const lockMs = act==='end' ? 3400 : 1800;
  cardLock[empId]=true; setTimeout(()=>{ cardLock[empId]=false; }, lockMs);
  if(act==='start'){
    DATA.active[empId]={ startTs:nowISO, pauses:[], status:'service' };
    save(); ping(false); renderEmpCards();
    showToast(empId, hm(tstr), 'Début', '', false);
  } else if(act==='pause'){
    const a=DATA.active[empId]; if(!a) return;
    a.pauses.push({startTs:nowISO, endTs:null}); a.status='pause';
    save(); ping(false); renderEmpCards();
    showToast(empId, hm(tstr), 'Pause', '', false);
  } else if(act==='resume'){
    const a=DATA.active[empId]; if(!a) return;
    const open=a.pauses.find(p=>!p.endTs); if(open) open.endTs=nowISO; a.status='service';
    save(); ping(false); renderEmpCards();
    showToast(empId, hm(tstr), 'Reprise', '', false);
  } else if(act==='end'){
    const a=DATA.active[empId]; if(!a) return;
    const open=a.pauses.find(p=>!p.endTs); if(open) open.endTs=nowISO;
    // build shift in start-date's records
    const startD=new Date(a.startTs); const dk=dateKey(startD);
    const sh={ start:hms(startD), end:tstr,
      pauses:a.pauses.filter(p=>p.endTs).map(p=>({start:hms(new Date(p.startTs)), end:hms(new Date(p.endTs))})) };
    if(!DATA.records[dk]) DATA.records[dk]={};
    if(!DATA.records[dk][empId]) DATA.records[dk][empId]={shifts:[], override:(DATA.records[dk][empId]&&DATA.records[dk][empId].override)||null};
    DATA.records[dk][empId].shifts.push(sh);
    delete DATA.active[empId];
    save(); ping(true); renderEmpCards();
    showToast(empId, hm(tstr), 'Fin de service', '', true);
  }
}

function doPromote(){

    }

  if(planDraft){

      } else {

        if(!DATA.records[dk][eid]) DATA.records[dk][eid]={shifts:[],override:null};
        DATA.records[dk][eid].override={am:v.am,pm:v.pm};
      }
    });

function demandProfile(dk, bucket){
  const dow=new Date(dk+'T12:00:00').getDay();
  const ov=(DATA.demandOv||{})[dk];
  const slots= ov? (ov[bucket]||[]) : ((((DATA.demand||{})[dow])||{})[bucket]||[]);
  const segs=slots.map(s=>[toSec(s[0]),toSec(s[1])]).filter(x=>x[1]>x[0]);
  const pts=[...new Set(segs.flat())].sort((a,b)=>a-b);
  let peak=0;
  for(let i=0;i<pts.length-1;i++){ const n=segs.filter(x=>x[0]<pts[i+1]&&x[1]>pts[i]).length; if(n>peak) peak=n; }
  const hours=segs.reduce((a,x)=>a+(x[1]-x[0]),0);
  return {slots, segs, pts, peak, hours};
}
function coverStatus(pl, dp){
  if(!dp.peak) return '';
  const pts=[...new Set([].concat(...pl, ...dp.segs))].sort((a,b)=>a-b);
  let lack=false, over=false;
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
    const p=pl.filter(x=>x[0]<b&&x[1]>a).length, q=dp.segs.filter(x=>x[0]<b&&x[1]>a).length;
    if(p<q) lack=true; if(p>q) over=true; }
  return lack?'red':(over?'blue':'green');
}
function calcSurplus(weekStart){
  const out=[]; const start=new Date(weekStart+'T12:00:00');
  const emps=DATA.employees.filter(e=>!e.inactive);
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const dk=dateKey(d);
    ['am','pm'].forEach(b=>{ const dp=demandProfile(dk,b);
      const pl=[]; emps.forEach(e=>{ const c=planCellContract(e.id,dk).c; const g=c[b]; if(g) pl.push([toSec(g[0]),toSec(g[1])]); });
      const pts=[...new Set([].concat(...pl, ...dp.segs))].sort((x,y)=>x-y);
      for(let j=0;j<pts.length-1;j++){ const a=pts[j], bb=pts[j+1];
        const p=pl.filter(x=>x[0]<bb&&x[1]>a).length, q=dp.segs.filter(x=>x[0]<bb&&x[1]>a).length;
        if(p>q) out.push({dk, bucket:b, a, b:bb, over:p-q}); }
    }); }
  return out;
}

const ZH_DAYS=['\u5468\u65e5','\u5468\u4e00','\u5468\u4e8c','\u5468\u4e09','\u5468\u56db','\u5468\u4e94','\u5468\u516d'];
function demandText(){

    if(sl.length) lines.push(`${ZH_DAYS[dw]} ${b==='am'?'\u5348':'\u665a'} ${sl.map(s=>s[0]+'-'+s[1]).join(' / ')}`); }); });

function parseDemandText(txt){
  const res={0:{am:[],pm:[]},1:{am:[],pm:[]},2:{am:[],pm:[]},3:{am:[],pm:[]},4:{am:[],pm:[]},5:{am:[],pm:[]},6:{am:[],pm:[]}};
  const timeR=/(\d{1,2})\s*[hH:.](\d{2})?\s*(?:[\u2013\u2014\-~]|\u00e0)\s*(\d{1,2})\s*[hH:.](\d{2})?/g;
  let found=0;
  txt.split(/\n+/).forEach(line=>{
    const low=line.trim().toLowerCase();
    let dow=null; for(const nm in DAY_NAMES){ if(low.startsWith(nm)){ dow=DAY_NAMES[nm]; break; } }
    if(dow===null) return;
    const b=/\u5348|midi|noon/.test(low)?'am':(/\u665a|soir|eve/.test(low)?'pm':null);
    if(!b) return;
    let m; timeR.lastIndex=0;
    while((m=timeR.exec(line))!==null){ res[dow][b].push([pad(+m[1])+':'+(m[2]||'00'), pad(+m[3])+':'+(m[4]||'00')]); found++; }
  });
  return found?res:null;
}

    pd+=` L ${X(iv[iv.length-1].b).toFixed(1)} ${Y(0)}`;
    g+=`<path d="${pd} Z" fill="rgba(201,169,97,.22)"/><path d="${pd}" fill="none" stroke="#C9A961" stroke-width="2"/>`;

      g+=`<line x1="${pl}" y1="${Y(dp.peak)}" x2="${W-pr}" y2="${Y(dp.peak)}" stroke="#7A1C1C" stroke-width="1.2" stroke-dasharray="2 3" opacity=".55"/>`;

    g+=`<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="rgba(31,27,23,.35)"/>`;
    body=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
    const list=items.sort((x,y)=>x.s-y.s).map(x=>`<div class="seg-emp"><span>${x.name}</span><span class="tnum">${hm2(x.seg)}</span></div>`).join('');

  modal(`<div class="modal-head"><h2 class="serif">${title}</h2><button class="x" onclick="openAdmin()">\u00d7</button></div><div class="modal-body">${body}</div>`);

function shiftDate(delta){ const d=new Date(recDate+'T12:00:00'); d.setDate(d.getDate()+delta); recDate=dateKey(d); renderTab(); }
function collectActual(dk, bucket){
  const items=[];
  DATA.employees.forEach(e=>{
    const rec=DATA.records[dk]&&DATA.records[dk][e.id];
    const contract=getContract(e.id, dk);
    if(rec&&rec.shifts) rec.shifts.forEach(sh=>{
      if(assignBucket(sh, contract)!==bucket) return;
      let a=toSec(sh.start), b=toSec(sh.end); if(b<a) b+=86400;
      if(b<=a) return;
      const works=shiftSegments(sh).map(sg=>{ let x=toSec(sg[0]), y=toSec(sg[1]); if(y<x) y+=86400; return [x,y]; }).filter(w=>w[1]>w[0]);
      items.push({name:e.name, pres:[a,b], works, ongoing:false});
    });
    const act=DATA.active[e.id];
    if(act && dateKey(new Date(act.startTs))===dk){
      const a=toSec(hms(new Date(act.startTs)));
      let b=toSec(hms(new Date())); if(b<a) b+=86400;
      if(b>a){
        const cg={start:hms(new Date(act.startTs)), end:hms(new Date()), pauses:act.pauses.filter(p=>p.endTs).map(p=>({start:hms(new Date(p.startTs)), end:hms(new Date(p.endTs))}))};
        if(assignBucket(cg, contract)===bucket){
          const works=shiftSegments(cg).map(sg=>{ let x=toSec(sg[0]), y=toSec(sg[1]); if(y<x) y+=86400; return [x,y]; }).filter(w=>w[1]>w[0]);
          items.push({name:e.name, pres:[a,b], works, ongoing:true});
        }
      }
    }
  });
  return items;
}
function fmtSec(x){ return String(Math.floor(x/3600)%24).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0'); }
function actualChartSvg(items, big, dk, bucket){
  const dp=(dk&&bucket)?demandProfile(dk,bucket):{peak:0,segs:[]};
  const pts=[...new Set(items.flatMap(x=>[x.pres[0],x.pres[1],...x.works.flat()]).concat(dp.segs.flat()))].sort((a,b)=>a-b);
  const iv=[]; let dataPeak=1;
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
    const nP=items.filter(x=>x.pres[0]<b && x.pres[1]>a).length;
    const nW=items.filter(x=>x.works.some(w=>w[0]<b && w[1]>a)).length;
    const q=dp.segs.filter(x=>x[0]<b && x[1]>a).length;
    iv.push({a,b,nP,nW,q}); if(nP>dataPeak) dataPeak=nP; }
  const maxN=Math.max(dataPeak, dp.peak, 1);
  const W=600, H=big?250:200, pl=28, pr=10, ptp=14, pb=big?54:44;
  const t0=pts[0], t1=pts[pts.length-1];
  const X=x=>pl+(x-t0)/Math.max(1,(t1-t0))*(W-pl-pr);
  const Y=n=>H-pb-(n/maxN)*(H-ptp-pb);
  let g='';
  for(let n=0;n<=maxN;n++) g+=`<line x1="${pl}" y1="${Y(n)}" x2="${W-pr}" y2="${Y(n)}" stroke="rgba(31,27,23,.08)"/><text x="${pl-6}" y="${Y(n)+3.5}" text-anchor="end" font-size="10" fill="#8A8378">${n}</text>`;
  iv.forEach(v=>{ if(v.nP===0&&(dp.peak===0||v.q>0)) g+=`<rect x="${X(v.a).toFixed(1)}" y="${ptp}" width="${(X(v.b)-X(v.a)).toFixed(1)}" height="${H-ptp-pb}" fill="rgba(122,28,28,.09)"/>`; });
  if(dp.peak>0) iv.forEach(v=>{ if(v.nW>dp.peak) g+=`<rect x="${X(v.a).toFixed(1)}" y="${Y(v.nW).toFixed(1)}" width="${(X(v.b)-X(v.a)).toFixed(1)}" height="${(Y(dp.peak)-Y(v.nW)).toFixed(1)}" fill="rgba(43,90,167,.35)"/>`; });
  const mkPath=key=>{ let p=`M ${X(iv[0].a).toFixed(1)} ${Y(0)}`;
    iv.forEach(v=>{ p+=` L ${X(v.a).toFixed(1)} ${Y(v[key]).toFixed(1)} L ${X(v.b).toFixed(1)} ${Y(v[key]).toFixed(1)}`; });
    p+=` L ${X(iv[iv.length-1].b).toFixed(1)} ${Y(0)}`; return p; };
  g+=`<path d="${mkPath('nP')} Z" fill="rgba(74,68,60,.16)"/><path d="${mkPath('nP')}" fill="none" stroke="rgba(74,68,60,.5)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  g+=`<path d="${mkPath('nW')} Z" fill="rgba(201,169,97,.30)"/><path d="${mkPath('nW')}" fill="none" stroke="#C9A961" stroke-width="2"/>`;
  if(dp.peak>0){
    let qd=`M ${X(iv[0].a).toFixed(1)} ${Y(iv[0].q).toFixed(1)}`;
    iv.forEach(v=>{ qd+=` L ${X(v.a).toFixed(1)} ${Y(v.q).toFixed(1)} L ${X(v.b).toFixed(1)} ${Y(v.q).toFixed(1)}`; });
    g+=`<path d="${qd}" fill="none" stroke="#7A1C1C" stroke-width="1.6" stroke-dasharray="6 4"/>`;
    g+=`<line x1="${pl}" y1="${Y(dp.peak)}" x2="${W-pr}" y2="${Y(dp.peak)}" stroke="#7A1C1C" stroke-width="1.2" stroke-dasharray="2 3" opacity=".55"/>`;
  }
  let lastX=-999; const rows=big?3:2;
  pts.forEach((p,i)=>{
    const x=X(p);
    g+=`<line x1="${x.toFixed(1)}" y1="${ptp}" x2="${x.toFixed(1)}" y2="${H-pb}" stroke="rgba(31,27,23,.14)" stroke-dasharray="3 3"/>`;
    const must=i===0||i===pts.length-1;
    if(!big && !must && x-lastX<34) return;
    g+=`<text x="${x.toFixed(1)}" y="${H-pb+((i%rows)*13+14)}" text-anchor="middle" font-size="10" fill="#4A443C">${fmtSec(p)}</text>`;
    lastX=x;
  });
  iv.forEach(v=>{ if(v.nW>0 && X(v.b)-X(v.a)>=30) g+=`<text x="${((X(v.a)+X(v.b))/2).toFixed(1)}" y="${(Y(v.nW)-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#7A5C1E">${v.nW}</text>`; });
  items.filter(x=>x.ongoing).forEach(x=>{ g+=`<circle cx="${X(x.pres[1]).toFixed(1)}" cy="${ptp+6}" r="4" fill="#C9A961"/>`; });
  g+=`<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="rgba(31,27,23,.35)"/>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`, t0, t1};
}
function buildActualChart(dk, bucket){
  const items=collectActual(dk, bucket);
  if(!items.length) return null;
  return `<div style="cursor:pointer" onclick="openChartZoom('${bucket}')">${actualChartSvg(items,false,dk,bucket).svg}</div>`;

function clearOverride(){
  const empId=ovBuf.emp;

function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return dd+'/'+m+'/'+y; }
function weeklyTotalOf(schedule){
  let wk=0; for(let dow=0;dow<7;dow++){ const sc=schedule[dow]; if(sc){ if(sc.am)wk+=spanSec(sc.am[0]+':00',sc.am[1]+':00'); if(sc.pm)wk+=spanSec(sc.pm[0]+':00',sc.pm[1]+':00'); } } return wk;
}
function sortVersions(e){ e.scheduleVersions.sort((a,b)=>(a.from||'0000-00-00').localeCompare(b.from||'0000-00-00')); }
function ctDays(e){ // 距到期天数; null=无到期
  if(!e.contract||!e.contract.to) return null;
  return Math.round((new Date(e.contract.to+'T12:00:00')-new Date(todayKey()+'T12:00:00'))/86400000);
}
function ctBadge(e){
  const c=e.contract; if(!c) return '';
  const wk=c.weekly?` \u00b7 ${secToHM(c.weekly)}/sem`:'';
  if(c.type==='CDI') return `<span class="ct-badge">CDI${wk}</span>`;
  const d=ctDays(e);
  let cls='';
  if(d!==null){ if(d<0) cls=' ct-dead'; else if(d<=3) cls=' ct-red'; else if(d<=7) cls=' ct-yellow'; }
  const dd=c.to? new Date(c.to+'T12:00:00') : null;
  const toTxt=dd? `${dd.getDate()}/${dd.getMonth()+1}` : '?';
  const dTxt=d===null?'':(d<0?` \u00b7 \u5df2\u5230\u671f${-d}\u5929`:` \u00b7 \u8fd8\u5269${d}\u5929`);
  return `<span class="ct-badge${cls}">CDD \u00b7 \u81f3 ${toTxt}${dTxt}${wk}</span>`;
}
function ctExpired(e, dk){ return !!(e.contract && e.contract.type==='CDD' && e.contract.to && dk>e.contract.to); }
function parseContractLines(txt){
  const out=[]; // {name,action:'set'|'end',type,from,to,weekly}
  txt.split(/\n+/).forEach(line=>{
    line=line.trim(); if(!line) return;
    if(!line.startsWith('#\u5408\u540c')) return;
    const rest=line.slice(3).trim();
    const parts=rest.split(/\s+/); if(!parts.length) return;
    const name=parts.shift();
    if(parts[0]==='\u7ec8\u6b62'){ out.push({name, action:'end'}); return; }
    const rec={name, action:'set', type:null, from:null, to:null, weekly:null};
    const dates=[];
    parts.forEach(p=>{
      const pl=p.toUpperCase();
      if(pl==='CDD'||pl==='CDI'){ rec.type=pl; return; }
      let m=p.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(m){ dates.push(p); return; }
      m=p.match(/^(\d{1,2})[hH](\d{2})?$/);
      if(m){ rec.weekly=(+m[1])*3600+(m[2]?+m[2]*60:0); return; }
    });
    if(dates.length===2){ rec.from=dates[0]; rec.to=dates[1]; }
    else if(dates.length===1){ if(rec.type==='CDD') rec.to=dates[0]; else rec.from=dates[0]; }
    if(rec.type) out.push(rec);
  });
  return out;
}
function applyContractPaste(){
  const ta=document.getElementById('ct-ta'); if(!ta) return;
  const recs=parseContractLines(ta.value);
  if(!recs.length){ alert('\u2715 \u683c\u5f0f: #\u5408\u540c \u59d3\u540d CDD 2026-10-15 10h'); return; }
  let ok=0, miss=[];
  recs.forEach(r=>{
    const le=DATA.employees.find(x=>x.name.toLowerCase()===r.name.toLowerCase())
      || DATA.employees.find(x=>x.name.toLowerCase().startsWith(r.name.toLowerCase()));
    if(!le){ miss.push(r.name); return; }
    if(r.action==='end'){ le.contract=null; ok++; return; }
    le.contract={type:r.type, from:r.from, to:r.to, weekly:r.weekly};
    ok++;
  });
  save(); renderTab();
  alert('\u2713 '+ok+(miss.length?('  \u2715 \u672a\u627e\u5230: '+miss.join(', ')):''));
}
function editContractField(empId, key, val){
  const e=emp(empId); if(!e) return;
  if(!e.contract) e.contract={type:'CDD', from:null, to:null, weekly:null};
  if(key==='type'){ e.contract.type=val||null; if(!val){ e.contract=null; } }
  else if(key==='weekly'){
    const m=(val||'').match(/^(\d{1,2})[hH:]?(\d{2})?$/);
    e.contract.weekly = m? (+m[1])*3600+(m[2]?+m[2]*60:0) : null;
  } else { e.contract[key]=val||null; }
  save(); renderTab();
}
function calcQuota(weekStart){ // 返回 {short:[{e,plan,quota}], over:[...]}
  const start=new Date(weekStart+'T12:00:00');
  const short=[], over=[];
  DATA.employees.filter(e=>!e.inactive && e.contract && e.contract.weekly).forEach(e=>{
    let tot=0;
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const dk=dateKey(d);
      const c=planCellContract(e.id,dk).c;
      if(c.am) tot+=spanSec(c.am[0]+':00',c.am[1]+':00');
      if(c.pm) tot+=spanSec(c.pm[0]+':00',c.pm[1]+':00'); }
    if(tot<e.contract.weekly) short.push({e, plan:tot, quota:e.contract.weekly});
    else if(tot>e.contract.weekly) over.push({e, plan:tot, quota:e.contract.weekly});
  });
  return {short, over};
}

const DAY_NAMES={
  'dimanche':0,'lundi':1,'mardi':2,'mercredi':3,'jeudi':4,'vendredi':5,'samedi':6,
  'sunday':0,'monday':1,'tuesday':2,'wednesday':3,'thursday':4,'friday':5,'saturday':6,
  '周日':0,'星期日':0,'周天':0,'周一':1,'星期一':1,'周二':2,'星期二':2,'周三':3,'星期三':3,'周四':4,'星期四':4,'周五':5,'星期五':5,'周六':6,'星期六':6
};
function parseSchedText(){
  const ta=document.getElementById('sched-paste'); const raw=ta?ta.value:'';
  schedBuf._pasteText=raw;
  const lines=raw.split(/\n+/); let found=0;
  const timeR=/(\d{1,2})\s*[hH:.](\d{2})?\s*(?:[\u2013\u2014\-~]|\u00e0)\s*(\d{1,2})\s*[hH:.](\d{2})?/g;
  if(schedBuf.isNew||!schedBuf.isBase){
    let dm=raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(dm){ schedBuf.from=dm[1]+'-'+pad(+dm[2])+'-'+pad(+dm[3]); }
    else if((dm=raw.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))){ schedBuf.from=dm[3]+'-'+pad(+dm[2])+'-'+pad(+dm[1]); }
    else if((dm=raw.match(/(\d{1,2})\u6708(\d{1,2})[\u53f7\u65e5]/))){ schedBuf.from=(new Date().getFullYear())+'-'+pad(+dm[1])+'-'+pad(+dm[2]); }
  }
  lines.forEach(line=>{
    const low=line.trim().toLowerCase();
    let dow=null;
    for(const name in DAY_NAMES){ if(low.startsWith(name)){ dow=DAY_NAMES[name]; break; } }
    if(dow===null) return;
    found++;
    if(/repos|\u4f11\u606f|\boff\b/.test(low)){ schedBuf.schedule[dow]=null; return; }
    const ranges=[]; let m; timeR.lastIndex=0;
    while((m=timeR.exec(line))!==null){
      ranges.push([ pad(+m[1])+':'+(m[2]||'00'), pad(+m[3])+':'+(m[4]||'00') ]);
    }
    if(!ranges.length){ schedBuf.schedule[dow]=null; return; }
    if(ranges.length===1){
      const startH=+ranges[0][0].split(':')[0];
      schedBuf.schedule[dow]= startH<15 ? {am:ranges[0], pm:null} : {am:null, pm:ranges[0]};
    } else {
      schedBuf.schedule[dow]={am:ranges[0], pm:ranges[1]};
    }
  });
  schedBuf._parseMsg = found>0 ? ('\u2713 '+found+' '+t('parsedDays')) : t('parseFail');
  drawSchedEdit();
}

  modal(`<div class="modal-head"><h2 class="serif">${schedBuf.isNew?t('newPeriod'):t('editSchedule')}</h2><button class="x" onclick="openAdmin()">×</button></div>
    <div class="modal-body">${body}<div style="height:10px"></div><button class="btn-primary" onclick="saveSched()">${t('save')}</button></div>`);

function ensureDay(dow){ if(!schedBuf.schedule[dow]) schedBuf.schedule[dow]={am:null,pm:null}; }
function toggleSched(dow,key,on){ ensureDay(dow); schedBuf.schedule[dow][key]= on?(key==='am'?['11:30','13:00']:['18:00','21:00']):null;

function setSched(dow,key,idx,val){ ensureDay(dow); if(!schedBuf.schedule[dow][key]) schedBuf.schedule[dow][key]=['','']; schedBuf.schedule[dow][key][idx]=val; }
function saveSched(){
  const e=emp(schedBuf.emp);
  const sc={}; for(let dow=0;dow<7;dow++){ const d=schedBuf.schedule[dow]; sc[dow]=(d&&(d.am||d.pm))?{am:d.am,pm:d.pm}:null; }
  const from = schedBuf.isBase ? null : (schedBuf.from||todayKey());
  if(schedBuf.isNew){
    // 同一生效日已存在则覆盖
    const exist=e.scheduleVersions.find(v=>(v.from||null)===from);
    if(exist) exist.schedule=sc; else e.scheduleVersions.push({from, schedule:sc});
  } else {
    e.scheduleVersions[schedBuf.vi]={from, schedule:sc};
  }
  sortVersions(e); save(); openAdmin();
}

function toB64(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function fromB64(b64){ const bin=atob(b64.trim()); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function genCode(){
  const code='PTG1:'+toB64(JSON.stringify(DATA));
  const out=document.getElementById('code-out'); const area=document.getElementById('code-area');
  out.style.display='block'; area.value=code; area.focus(); area.select();
}
function copyCode(){
  const area=document.getElementById('code-area'); const msg=document.getElementById('code-msg');
  const txt=area.value;
  const ok=()=>{ msg.textContent=t('copied'); setTimeout(()=>{if(msg)msg.textContent='';},2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,()=>{ area.select(); document.execCommand('copy'); ok(); }); }
  else { area.select(); document.execCommand('copy'); ok(); }
}
function restoreMode(){
  const r=document.querySelector('input[name=rmode]:checked');
  return r? r.value : 'merge';
}
// 合并：只补缺，绝不覆盖本机已有内容
function mergeData(inc){
  let addedDays=0, addedEmps=0, addedVers=0;
  // 先把导入数据升级到新结构
  const tmp=DATA; DATA=inc; migrate(); inc=DATA; DATA=tmp;
  (inc.employees||[]).forEach(ie=>{
    const le=DATA.employees.find(e=>e.id===ie.id);
    if(!le){ DATA.employees.push(ie); addedEmps++; }
    else if(ie.scheduleVersions && le.scheduleVersions){
      // 排班版本按"生效日"补缺：对方有的版本本机没有 → 补入；同生效日 → 本机优先
      ie.scheduleVersions.forEach(iv=>{
        const f=iv.from||null;
        if(!le.scheduleVersions.find(lv=>(lv.from||null)===f)){
          le.scheduleVersions.push(JSON.parse(JSON.stringify(iv))); addedVers++;
        }
      });
      le.scheduleVersions.sort((a,b)=>(a.from||'0000-00-00').localeCompare(b.from||'0000-00-00'));
    }
  });
  Object.keys(inc.records||{}).forEach(dk=>{
    Object.keys(inc.records[dk]).forEach(eid=>{
      if(!DATA.records[dk]) DATA.records[dk]={};
      if(!DATA.records[dk][eid]){ DATA.records[dk][eid]=inc.records[dk][eid]; addedDays++; }
      // 本机已有该天该人 → 保留本机，不动
    });
  });
  return {addedDays, addedEmps, addedVers};
}
function applyRestore(d, msgEl){
  if(!(d&&d.employees&&d.records)){ msgEl.style.color='var(--wine)'; msgEl.textContent=t('invalidCode'); return; }
  if(restoreMode()==='replace'){
    if(!confirm(t('replaceConfirm'))) return;
    DATA=d; migrate(); save();
    msgEl.style.color='var(--moss)'; msgEl.textContent=t('restored');
  } else {
    const r=mergeData(d); migrate(); save();
    msgEl.style.color='var(--moss)';
    let m=`${t('merged')}: +${r.addedDays} ${t('mergedDays')}, +${r.addedEmps} ${t('mergedEmps')}`;
    if(r.addedVers>0) m+=`, +${r.addedVers} ${t('mergedVers')}`;
    msgEl.textContent=m;
  }
  setTimeout(()=>openAdmin(),1400);
}
function restoreCode(){
  const raw=document.getElementById('code-in').value.trim(); const msg=document.getElementById('restore-msg');
  if(!raw){ return; }
  try{
    const b64 = raw.startsWith('PTG1:') ? raw.slice(5) : raw;
    const d=JSON.parse(fromB64(b64));
    applyRestore(d, msg);
  }catch(e){ msg.style.color='var(--wine)'; msg.textContent=t('invalidCode'); }
}

function download(filename, blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },100);
}
async function shareBackupFile(){
  const today=todayKey();
  const fname=`pointage_sauvegarde_${today}.json`;
  const blob=new Blob([JSON.stringify(DATA)],{type:'application/json'});

    try{ await navigator.share(payload); return; }catch(e){ if(e&&e.name==='AbortError') return; }

function importBackup(input){

  r.readAsText(f);
}

  const days={}; const segs={}; const ot={}; const pSegs={}; const pDur={}; let meals=0;
  for(let d=1;d<=daysInMonth;d++){ const dk=`${y}-${pad(m)}-${pad(d)}`;
    const c=getContract(e.id, dk);
    const pp=[]; let pd=0;
    if(c.am){ pp.push(c.am[0]+'\u2013'+c.am[1]); pd+=spanSec(c.am[0]+':00',c.am[1]+':00'); }
    if(c.pm){ pp.push(c.pm[0]+'\u2013'+c.pm[1]); pd+=spanSec(c.pm[0]+':00',c.pm[1]+':00'); }
    if(pd>0){ pSegs[d]=pp.join(' / '); pDur[d]=pd; }
    const net=dayNetWorked(e.id,dk);
    if(net>0){ days[d]=net; meals+=dayMeals(e.id,dk);
      const rec=DATA.records[dk][e.id]; const parts=[];
      rec.shifts.forEach(sh=>{ shiftSegments(sh).forEach(sg=>{ if(spanSec(sg[0],sg[1])>0) parts.push(hm(sg[0])+'\u2013'+hm(sg[1])); }); });
      segs[d]=parts.join(' / ');
      ot[d]=dayOvertime(e.id,dk).total;
    } }
  return {name:e.name, days, segs, ot, pSegs, pDur, meals};
}
function exportMonth(){
  const [y,m]=expYM.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const emps=DATA.employees.map(e=>buildMonthEmp(e,y,m,daysInMonth));
  const monthName=I18N.fr.months[m-1]+' '+y;
  const bytes=makeXlsx(emps, daysInMonth, monthName, true, y, m);
  download(`Pointage_${expYM}.xlsx`, new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function weeklyRated(empId, dk){
  const e=emp(empId); if(!e) return 0;
  const sched=scheduleFor(e, dk); let t=0;
  for(let d=0;d<7;d++){ const sc=sched[d]; if(!sc) continue;
    if(sc.am) t+=spanSec(sc.am[0]+':00',sc.am[1]+':00');
    if(sc.pm) t+=spanSec(sc.pm[0]+':00',sc.pm[1]+':00'); }
  return t;
}
function acctEmpBlock(e, y, m, daysInMonth, lastDk){
  const hSec=x=>{x=Math.round(x); return Math.floor(x/3600)+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
  let tn=0,to=0,meals=0,has=false;
  for(let d=1;d<=daysInMonth;d++){ const dk=`${y}-${pad(m)}-${pad(d)}`;
    const net=dayNetWorked(e.id,dk);
    if(net>0){ has=true; tn+=net; to+=dayOvertime(e.id,dk).total; meals+=dayMeals(e.id,dk); } }
  if(!has) return null;
  const ctLine=(function(){ const c=e.contract; if(!c) return null;
    const fd=x=>{ if(!x) return null; const d=new Date(x+'T12:00:00'); return d.getDate()+'/'+(d.getMonth()+1); };
    const wk=c.weekly?` \u00b7 \u6bcf\u5468${secToHM(c.weekly)}`:'';
    if(c.type==='CDI') return `\u5408\u540c\uff1aCDI${wk}`;
    const rng=[fd(c.from),fd(c.to)].filter(Boolean).join(' \u2192 ');
    return `\u5408\u540c\uff1aCDD ${rng}${wk}`; })();
  const head=ctLine? [e.name,'',ctLine,''] : [e.name,''];
  return head.concat([
    `\u989d\u5b9a\u6bcf\u5468\u5de5\u4f5c\u65f6\u95f4\uff1a${secToHM(weeklyRated(e.id,lastDk))}`,'',
    `\u5b9e\u9645\u603b\u5de5\u4f5c\u65f6\u95f4\uff1a${hSec(tn)}`,'',
    `\u5b9e\u9645\u603b\u52a0\u73ed\u65f6\u95f4\uff08\u5df2\u5305\u542b\u5728\u603b\u5de5\u4f5c\u65f6\u95f4\u4e4b\u5185\uff09\uff1a${hSec(to)}`,'',
    `\u63d0\u4f9b\u9910\u98df\u6570\uff1a${meals}`]);
}
async function shareAcctEmp(empId){
  const e=emp(empId); if(!e) return;
  const [y,m]=expYM.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const lastDk=`${y}-${pad(m)}-${pad(daysInMonth)}`;
  const blk=acctEmpBlock(e, y, m, daysInMonth, lastDk);
  if(!blk){ alert('\u2014'); return; }
  const txt=[`${y}\u5e74${m}\u6708 \u8003\u52e4\u6c47\u603b \u2014 ${e.name}`,''].concat(blk).join('\n');
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(err){ if(err&&err.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(txt); alert(t('copiedSched')); }
  catch(err){ prompt('', txt); }
}
function acctSummaryText(){
  const [y,m]=expYM.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const lastDk=`${y}-${pad(m)}-${pad(daysInMonth)}`;
  const out=[`${y}\u5e74${m}\u6708 \u8003\u52e4\u6c47\u603b`];
  DATA.employees.forEach(e=>{
    const blk=acctEmpBlock(e, y, m, daysInMonth, lastDk);
    if(!blk) return;
    out.push('','\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014','');
    out.push.apply(out, blk);
  });
  return out.join('\n');
}
async function shareAcctSummary(){
  const txt=acctSummaryText();
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(txt); alert(t('copiedSched')); }
  catch(e){ prompt('', txt); }
}
function openEmpMonth(empId){
  const e=emp(empId); if(!e) return;
  const [y,m]=expYM.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const L=I18N[DATA.lang];
  let rows=''; let tot=0, totOt=0, totP=0, days=0, meals=0;
  for(let d=1;d<=daysInMonth;d++){
    const dk=`${y}-${pad(m)}-${pad(d)}`;
    const net=dayNetWorked(e.id,dk);
    if(net<=0) continue;
    days++; tot+=net; meals+=dayMeals(e.id,dk);
    const ot=dayOvertime(e.id,dk).total; totOt+=ot;
    const c=getContract(e.id,dk);
    const pp=[]; let pd=0;
    if(c.am){ pp.push(hm2(c.am)); pd+=spanSec(c.am[0]+':00',c.am[1]+':00'); }
    if(c.pm){ pp.push(hm2(c.pm)); pd+=spanSec(c.pm[0]+':00',c.pm[1]+':00'); }
    totP+=pd;
    const rec=DATA.records[dk][e.id]; const parts=[];
    rec.shifts.forEach(sh=>{ shiftSegments(sh).forEach(sg=>{ if(spanSec(sg[0],sg[1])>0) parts.push(hm(sg[0])+'\u2013'+hm(sg[1])); }); });
    const dow=L.days[new Date(dk+'T12:00:00').getDay()].slice(0,3);
    rows+=`<tr><td class="ed-d">${d} <span>${dow}</span></td><td class="tnum"><span class="pl-sched">${pp.join(' / ')||'\u2014'}</span><br><b>${parts.join(' / ')}</b></td><td class="tnum">${pd>0?secToHM(pd):'\u2014'}</td><td class="tnum">${secToHM(net)}</td><td class="tnum ${ot>0?'ed-ot':''}">${ot>0?'+'+secToHM(ot):'\u2014'}</td></tr>`;
  }
  modal(`<div class="modal-head"><h2 class="serif">${e.name} \u00b7 ${L.months[m-1]} ${y}</h2><button class="x" onclick="openAdmin()">\u00d7</button></div>
  <div class="modal-body">
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat"><div class="sl">${t('net')}</div><div class="sv tnum">${secToHM(tot)}</div></div>
      <div class="stat"><div class="sl">${t('overtime')}</div><div class="sv tnum">${secToHM(totOt)}</div></div>
    </div>
    <div class="sl" style="margin-bottom:10px">${t('daysWorked')}: ${days} \u00b7 ${t('meals')}: ${meals} \u00b7 ${t('planned')}: ${secToHM(totP)}</div>
    ${rows?`<table class="emp-detail"><thead><tr><th></th><th>Horaires</th><th>${t('planned')}</th><th>${t('net')}</th><th>${t('overtime')}</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t('noRecord')}</div>`}
    <button class="btn-sec" onclick="exportMonthFor('${e.id}')">\u2b07 ${t('monthExport')} \u00b7 ${e.name}</button>
    <button class="btn-sec" onclick="shareAcctEmp('${e.id}')">📋 ${t('acctEmpBtn')} \u00b7 ${e.name}</button>
  </div>`);
}
function exportMonthFor(empId){
  const [y,m]=expYM.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const e=emp(empId); if(!e) return;
  const data=buildMonthEmp(e,y,m,daysInMonth);
  const monthName=I18N.fr.months[m-1]+' '+y;
  const bytes=makeXlsx([data], daysInMonth, monthName, false, y, m);
  download(`Pointage_${expYM}_${e.name}.xlsx`, new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
